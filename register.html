<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account — EcoLith</title>
    <meta
      name="description"
      content="Sign up for EcoLith food waste intelligence and resource recovery."
    />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <!-- Minimal Header -->
    <header class="app-header">
      <div class="app-container header-container">
        <a href="index.html" class="brand-link">
          <svg
            class="brand-logo-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 2v8"></path>
            <path d="m4.93 10.93 1.41 1.41"></path>
            <path d="M2 18h2"></path>
            <path d="M20 18h2"></path>
            <path d="m19.07 10.93-1.41 1.41"></path>
            <path d="M22 22H2"></path>
            <path d="m8 6 4-4 4 4"></path>
            <path d="M16 18a4 4 0 0 0-8 0"></path>
          </svg>
          <span>EcoLith</span>
        </a>
        <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </header>

    <main class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">Create Account</h1>
          <p class="auth-subtitle">Join EcoLith and start recovering value from waste</p>
        </div>

        <!-- Alert Message Box -->
        <div id="authAlert" class="auth-alert" role="alert" aria-live="polite"></div>

        <!-- Social Logins -->
        <div class="oauth-buttons">
          <button type="button" id="btnGoogleSignUp" class="btn btn-oauth btn-block">
            <svg class="oauth-icon" viewBox="0 0 24 24">
              <path
                fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              />
              <path
                fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              />
              <path
                fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
              />
              <path
                fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
              />
            </svg>
            Sign up with Google
          </button>
        </div>

        <div class="auth-divider">
          <span>or register with email</span>
        </div>

        <!-- Registration Form -->
        <form id="registerForm" novalidate>
          <div class="form-group">
            <label for="regName" class="form-label">Full Name / Display Name</label>
            <input
              type="text"
              id="regName"
              name="name"
              class="form-input"
              required
              autocomplete="name"
              placeholder="Jane Doe"
            />
          </div>

          <div class="form-group">
            <label for="regEmail" class="form-label">Email Address</label>
            <input
              type="email"
              id="regEmail"
              name="email"
              class="form-input"
              required
              autocomplete="email"
              placeholder="you@example.com"
            />
          </div>

          <div class="form-group">
            <label for="regPassword" class="form-label">Password</label>
            <input
              type="password"
              id="regPassword"
              name="password"
              class="form-input"
              required
              minlength="6"
              autocomplete="new-password"
              placeholder="At least 6 characters"
            />
            <span class="form-help">Must be at least 6 characters long.</span>
          </div>

          <div class="form-group">
            <label for="regConfirmPassword" class="form-label">Confirm Password</label>
            <input
              type="password"
              id="regConfirmPassword"
              name="confirmPassword"
              class="form-input"
              required
              minlength="6"
              autocomplete="new-password"
              placeholder="Repeat your password"
            />
          </div>

          <button
            type="submit"
            id="btnRegSubmit"
            class="btn btn-primary btn-block btn-lg"
            style="margin-top: var(--spacing-4)"
          >
            <span class="btn-text">Create Account</span>
            <span class="spinner sr-only" id="regSpinner" aria-hidden="true"></span>
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="login.html" class="auth-link">Sign in</a>
        </div>
      </div>
    </main>

    <script type="module">
      import { signUp, signInWithOAuth, getSession } from './js/auth.js';

      const registerForm = document.getElementById('registerForm');
      const authAlert = document.getElementById('authAlert');
      const btnRegSubmit = document.getElementById('btnRegSubmit');
      const regSpinner = document.getElementById('regSpinner');
      const btnGoogleSignUp = document.getElementById('btnGoogleSignUp');

      function showAlert(element, message, type = 'error') {
        element.textContent = message;
        element.className = `auth-alert auth-alert-${type}`;
        element.style.display = 'block';
      }

      function hideAlert(element) {
        element.textContent = '';
        element.style.display = 'none';
      }

      // Check if user is already logged in
      const existingSession = await getSession();
      if (existingSession) {
        window.location.replace('dashboard.html');
      }

      // Google Sign-Up
      btnGoogleSignUp.addEventListener('click', async () => {
        try {
          hideAlert(authAlert);
          await signInWithOAuth('google');
        } catch (err) {
          showAlert(authAlert, err.message || 'Failed to initiate Google sign in.');
        }
      });

      // Register Form Submit
      registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert(authAlert);

        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirmPassword = document.getElementById('regConfirmPassword').value;

        if (!name || !email || !password) {
          showAlert(authAlert, 'Please fill in all required fields.');
          return;
        }

        if (password.length < 6) {
          showAlert(authAlert, 'Password must be at least 6 characters long.');
          return;
        }

        if (password !== confirmPassword) {
          showAlert(authAlert, 'Passwords do not match.');
          return;
        }

        btnRegSubmit.disabled = true;
        regSpinner.classList.remove('sr-only');

        try {
          const data = await signUp(email, password, name);
          if (data.session) {
            // Direct login (email confirmation disabled in Supabase dev settings)
            window.location.replace('dashboard.html');
          } else {
            showAlert(
              authAlert,
              'Account created! A confirmation link has been sent to your email. Please verify before signing in.',
              'success'
            );
            registerForm.reset();
          }
        } catch (err) {
          showAlert(authAlert, err.message || 'Failed to create account.');
        } finally {
          btnRegSubmit.disabled = false;
          regSpinner.classList.add('sr-only');
        }
      });
    </script>
  </body>
</html>
