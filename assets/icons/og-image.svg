<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#f4f4f0" />
  <rect x="20" y="20" width="1160" height="590" fill="#ffffff" stroke="#000000" stroke-width="8" />
  
  <!-- Brutalist pattern grid accents -->
  <line x1="20" y1="120" x2="1180" y2="120" stroke="#000000" stroke-width="4" />
  <line x1="840" y1="120" x2="840" y2="610" stroke="#000000" stroke-width="4" />

  <!-- Brand Header -->
  <g transform="translate(60, 44)">
    <img x="0" y="-20" width="50" height="50" href="favicon.ico" />
    <text x="70" y="38" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="34" font-weight="900" fill="#000000" letter-spacing="-1">ECOLITH</text>
    <text x="240" y="37" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="18" font-weight="700" fill="#4b5563" letter-spacing="1">TURNING WASTE INTO OPPORTUNITY</text>
  </g>

  <!-- Main Hero Headline -->
  <g transform="translate(60, 200)">
    <rect x="0" y="-30" width="360" height="38" fill="#ccff00" stroke="#000000" stroke-width="3" />
    <text x="16" y="-6" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" fill="#000000" letter-spacing="1.5">CIRCULAR RESOURCE RECOVERY</text>
    
    <text x="0" y="55" font-family="'Space Grotesk', sans-serif" font-size="56" font-weight="900" fill="#000000" letter-spacing="-2">AI-POWERED FOOD</text>
    <text x="0" y="125" font-family="'Space Grotesk', sans-serif" font-size="56" font-weight="900" fill="#000000" letter-spacing="-2">WASTE INTELLIGENCE</text>
    
    <text x="0" y="190" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="500" fill="#4b5563">
      Classify organic residue in seconds. Discover validated circular pathways
    </text>
    <text x="0" y="224" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="500" fill="#4b5563">
      from biogas &amp; pectin recovery to composting. BYOK Privacy First.
    </text>
  </g>

  <!-- Right Brutalist Card Panel -->
  <g transform="translate(870, 160)">
    <rect width="270" height="190" fill="#ccff00" stroke="#000000" stroke-width="4" />
    <rect x="12" y="12" width="270" height="190" fill="none" stroke="#000000" stroke-width="4" />
    <text x="30" y="55" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#000000">DIVERSION METRIC</text>
    <text x="30" y="115" font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="900" fill="#000000">UP TO 85%</text>
    <text x="30" y="155" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#000000">RESOURCE RECOVERY</text>
  </g>

  <g transform="translate(870, 400)">
    <rect width="270" height="160" fill="#000000" stroke="#000000" stroke-width="4" />
    <text x="30" y="50" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#ccff00">ZERO DATA RETENTION</text>
    <text x="30" y="90" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" fill="#ffffff">BYOK ENCRYPTED</text>
    <text x="30" y="125" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="500" fill="#a1a1aa">AES-256-GCM In-Memory</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(60, 520)">
    <rect width="180" height="42" fill="#000000" stroke="#000000" stroke-width="2" />
    <text x="18" y="27" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Smart Vision Scan</text>

    <rect x="200" width="190" height="42" fill="#000000" stroke="#000000" stroke-width="2" />
    <text x="218" y="27" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Pectin &amp; Bio-Gas</text>

    <rect x="410" width="190" height="42" fill="#000000" stroke="#000000" stroke-width="2" />
    <text x="428" y="27" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Carbon Averted</text>
  </g>
