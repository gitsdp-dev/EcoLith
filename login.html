<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — EcoLith Food Waste Intelligence</title>
    <meta
      name="description"
      content="Sign in to your EcoLith account. Access your personal food waste scanner, circular recovery records, and environmental impact dashboard."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ecolith.app/login.html" />
    <meta name="theme-color" content="#000000" />

    <!-- Favicon & PWA -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
    <link rel="apple-touch-icon" href="assets/icons/icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sign In — EcoLith" />
    <meta
      property="og:description"
      content="Sign in to your EcoLith food waste intelligence and circular resource recovery account."
    />
    <meta property="og:url" content="https://ecolith.app/login.html" />
    <meta property="og:image" content="https://ecolith.app/assets/icons/og-image.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sign In — EcoLith" />
    <meta
      name="twitter:description"
      content="Sign in to your EcoLith food waste intelligence and circular resource recovery account."
    />
    <meta name="twitter:image" content="https://ecolith.app/assets/icons/og-image.svg" />

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <!-- Minimal Header -->
    <header class="app-header">
      <div class="app-container header-container">
        <a href="index.html" class="brand-link">
          <svg
            class="brand-logo-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 2v8"></path>
            <path d="m4.93 10.93 1.41 1.41"></path>
            <path d="M2 18h2"></path>
            <path d="M20 18h2"></path>
            <path d="m19.07 10.93-1.41 1.41"></path>
            <path d="M22 22H2"></path>
            <path d="m8 6 4-4 4 4"></path>
            <path d="M16 18a4 4 0 0 0-8 0"></path>
          </svg>
          <span>EcoLith</span>
        </a>
        <a href="register.html" class="btn btn-outline btn-sm">Create Account</a>
      </div>
    </header>

    <main class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">Sign in to your EcoLith account</p>
        </div>

        <!-- Alert Message Box -->
        <div id="authAlert" class="auth-alert" role="alert" aria-live="polite"></div>

        <!-- Social Logins -->
        <div class="oauth-buttons">
          <button type="button" id="btnGoogleSignIn" class="btn btn-oauth btn-block">
            <svg class="oauth-icon" viewBox="0 0 24 24">
              <path
                fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              />
              <path
                fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              />
              <path
                fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
              />
              <path
                fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
              />
            </svg>
            Continue with Google
          </button>
        </div>

        <div class="auth-divider">
          <span>or sign in with email</span>
        </div>

        <!-- Password Login Form -->
        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="loginEmail" class="form-label">Email Address</label>
            <input
              type="email"
              id="loginEmail"
              name="email"
              class="form-input"
              required
              autocomplete="email"
              placeholder="you@example.com"
            />
            <span id="emailError" class="form-error"></span>
          </div>

          <div class="form-group">
            <div class="auth-action-row" style="margin-bottom: var(--spacing-2)">
              <label for="loginPassword" class="form-label" style="margin-bottom: 0"
                >Password</label
              >
              <button
                type="button"
                id="btnForgotPwd"
                class="auth-link"
                style="background: none; border: none; cursor: pointer; padding: 0"
              >
                Forgot Password?
              </button>
            </div>
            <input
              type="password"
              id="loginPassword"
              name="password"
              class="form-input"
              required
              autocomplete="current-password"
              placeholder="••••••••"
            />
            <span id="passwordError" class="form-error"></span>
          </div>

          <button
            type="submit"
            id="btnLoginSubmit"
            class="btn btn-primary btn-block btn-lg"
            style="margin-top: var(--spacing-4)"
          >
            <span class="btn-text">Sign In</span>
            <span class="spinner sr-only" id="loginSpinner" aria-hidden="true"></span>
          </button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a href="register.html" class="auth-link">Sign up</a>
        </div>
      </div>
    </main>

    <!-- Forgot Password Modal -->
    <div id="resetPwdModal" class="modal-backdrop" style="display: none">
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="resetModalTitle">
        <div class="modal-header">
          <h2 id="resetModalTitle" class="auth-title" style="font-size: var(--font-size-lg)">
            Reset Password
          </h2>
          <button
            type="button"
            id="btnCloseResetModal"
            class="btn btn-outline btn-sm"
            aria-label="Close modal"
          >
            ✕
          </button>
        </div>
        <form id="resetPwdForm">
          <div class="modal-body">
            <p class="text-sm text-muted" style="margin-bottom: var(--spacing-4)">
              Enter your registered email address and we will send you a password reset link.
            </p>
            <div id="resetAlert" class="auth-alert" role="alert"></div>
            <div class="form-group">
              <label for="resetEmail" class="form-label">Email Address</label>
              <input
                type="email"
                id="resetEmail"
                class="form-input"
                required
                placeholder="you@example.com"
              />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" id="btnCancelReset" class="btn btn-secondary">Cancel</button>
            <button type="submit" id="btnSubmitReset" class="btn btn-primary">
              Send Reset Link
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Update Password Modal (if coming from reset link) -->
    <div id="updatePwdModal" class="modal-backdrop" style="display: none">
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="updateModalTitle">
        <div class="modal-header">
          <h2 id="updateModalTitle" class="auth-title" style="font-size: var(--font-size-lg)">
            Set New Password
          </h2>
        </div>
        <form id="updatePwdForm">
          <div class="modal-body">
            <div id="updateAlert" class="auth-alert" role="alert"></div>
            <div class="form-group">
              <label for="newPassword" class="form-label">New Password</label>
              <input
                type="password"
                id="newPassword"
                class="form-input"
                required
                minlength="6"
                placeholder="At least 6 characters"
              />
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" id="btnSubmitUpdatePwd" class="btn btn-primary">
              Save New Password
            </button>
          </div>
        </form>
      </div>
    </div>

    <script type="module">
      import { CONFIG } from './js/config.js';
      import {
        signInWithPassword,
        signInWithOAuth,
        resetPassword,
        updatePassword,
        getSession
      } from './js/auth.js';

      const loginForm = document.getElementById('loginForm');
      const authAlert = document.getElementById('authAlert');
      const btnLoginSubmit = document.getElementById('btnLoginSubmit');
      const loginSpinner = document.getElementById('loginSpinner');
      const btnGoogleSignIn = document.getElementById('btnGoogleSignIn');

      // Forgot password modal elements
      const btnForgotPwd = document.getElementById('btnForgotPwd');
      const resetPwdModal = document.getElementById('resetPwdModal');
      const btnCloseResetModal = document.getElementById('btnCloseResetModal');
      const btnCancelReset = document.getElementById('btnCancelReset');
      const resetPwdForm = document.getElementById('resetPwdForm');
      const resetEmail = document.getElementById('resetEmail');
      const resetAlert = document.getElementById('resetAlert');

      // Update password modal (for recovery token in hash)
      const updatePwdModal = document.getElementById('updatePwdModal');
      const updatePwdForm = document.getElementById('updatePwdForm');
      const newPassword = document.getElementById('newPassword');
      const updateAlert = document.getElementById('updateAlert');

      function showAlert(element, message, type = 'error') {
        element.textContent = message;
        element.className = `auth-alert auth-alert-${type}`;
        element.style.display = 'block';
      }

      function hideAlert(element) {
        element.textContent = '';
        element.style.display = 'none';
      }

      const urlParams = new URLSearchParams(window.location.search);
      const rawReturnTo = urlParams.get('returnTo') || 'dashboard.html';
      const returnTo = rawReturnTo.replace(/^\//, '');

      // Check if logged out due to 14-day inactivity
      if (urlParams.get('reason') === 'session_expired') {
        showAlert(
          authAlert,
          'Your 14-day login session has expired due to inactivity. Please sign in again.',
          'info'
        );
      }

      // Check if user is already logged in
      const existingSession = await getSession();

      if (existingSession && !window.location.hash.includes('type=recovery')) {
        window.location.replace(returnTo);
      }

      // Check for recovery flow in URL
      if (
        window.location.hash.includes('type=recovery') ||
        window.location.hash === '#reset-password'
      ) {
        updatePwdModal.style.display = 'flex';
      }

      // Google Sign-In
      btnGoogleSignIn.addEventListener('click', async () => {
        try {
          hideAlert(authAlert);
          await signInWithOAuth('google');
        } catch (err) {
          showAlert(authAlert, err.message || 'Failed to initiate Google sign in.');
        }
      });

      // Email/Password Form Submit
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert(authAlert);

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!email || !password) {
          showAlert(authAlert, 'Please enter both email and password.');
          return;
        }

        btnLoginSubmit.disabled = true;
        loginSpinner.classList.remove('sr-only');

        try {
          const authData = await signInWithPassword(email, password);
          const session = authData?.session;

          // Check if user has registered their Gemini API key
          if (session) {
            try {
              const statusRes = await fetch(`${CONFIG.API_BASE_URL}/api/keys/status`, {
                headers: { Authorization: `Bearer ${session.access_token}` }
              });
              if (statusRes.ok) {
                const keyStatus = await statusRes.json();
                if (!keyStatus.hasKey) {
                  // Direct first-time user to software initialization UI
                  window.location.replace('keyvault.html?init=true');
                  return;
                }
              }
            } catch (err) {
              console.warn('[LOGIN] Key status check deferred:', err);
            }
          }

          window.location.replace(returnTo);
        } catch (err) {
          showAlert(authAlert, err.message || 'Invalid email or password.');
        } finally {
          btnLoginSubmit.disabled = false;
          loginSpinner.classList.add('sr-only');
        }
      });

      // Forgot Password Flow
      btnForgotPwd.addEventListener('click', () => {
        resetPwdModal.style.display = 'flex';
        resetEmail.value = document.getElementById('loginEmail').value.trim();
        hideAlert(resetAlert);
      });

      const closeReset = () => {
        resetPwdModal.style.display = 'none';
      };
      btnCloseResetModal.addEventListener('click', closeReset);
      btnCancelReset.addEventListener('click', closeReset);

      resetPwdForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = resetEmail.value.trim();
        if (!email) return;

        try {
          await resetPassword(email);
          showAlert(resetAlert, 'Password reset email sent. Check your inbox.', 'success');
          setTimeout(() => closeReset(), 3000);
        } catch (err) {
          showAlert(resetAlert, err.message || 'Failed to send reset email.');
        }
      });

      // Update Password Flow
      updatePwdForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const pwd = newPassword.value;
        if (!pwd || pwd.length < 6) {
          showAlert(updateAlert, 'Password must be at least 6 characters.');
          return;
        }

        try {
          await updatePassword(pwd);
          showAlert(updateAlert, 'Password updated successfully! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1500);
        } catch (err) {
          showAlert(updateAlert, err.message || 'Failed to update password.');
        }
      });
    </script>
  </body>
</html>
